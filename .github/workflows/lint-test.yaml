name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "ct.yaml"
      - ".github/workflows/lint-test.yaml"
      - ".github/workflows/release.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          image_value() {
            awk -v key="$2" '
              /^image:$/ { in_image=1; next }
              in_image && /^[^ ]/ { exit }
              in_image && $1 == key ":" { gsub(/"/, "", $2); print $2; exit }
            ' "$1"
          }

          changed=$(ct list-changed --config ct.yaml)
          release_pending_chart="charts/rootly-private-agent"
          pending=()
          releasable=()
          while IFS= read -r chart; do
            base_pending=false
            if git cat-file -e "origin/master:$chart/.release-pending" 2>/dev/null; then
              base_pending=true
            fi
            if [[ ( -f "$chart/.release-pending" || "$base_pending" == true ) && "$chart" != "$release_pending_chart" ]]; then
              echo ".release-pending is currently supported only for $release_pending_chart."
              exit 1
            fi
            if [[ -f "$chart/.release-pending" ]]; then
              current_version=$(helm show chart "$chart" | awk '$1 == "version:" { print $2 }')
              current_app_version=$(helm show chart "$chart" | awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }')
              previous_chart=$(mktemp)
              previous_values=$(mktemp)
              git show "origin/master:$chart/Chart.yaml" > "$previous_chart"
              git show "origin/master:$chart/values.yaml" > "$previous_values"
              previous_version=$(awk '$1 == "version:" { print $2 }' "$previous_chart")
              previous_app_version=$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }' "$previous_chart")
              current_tag=$(image_value "$chart/values.yaml" tag)
              current_digest=$(image_value "$chart/values.yaml" digest)
              previous_tag=$(image_value "$previous_values" tag)
              previous_digest=$(image_value "$previous_values" digest)
              rm -f "$previous_chart" "$previous_values"
              if [[ "$current_version" != "$previous_version" || "$current_app_version" != "$previous_app_version" ||
                    "$current_tag" != "$previous_tag" || "$current_digest" != "$previous_digest" ]]; then
                echo "$chart is release-pending, so chart, app, and image versions must remain unchanged."
                exit 1
              fi
              ct lint --config ct.yaml --check-version-increment=false --charts "$chart"
              pending+=("$chart")
            else
              if [[ "$base_pending" == true ]]; then
                previous_chart=$(mktemp)
                previous_values=$(mktemp)
                git show "origin/master:$chart/Chart.yaml" > "$previous_chart"
                git show "origin/master:$chart/values.yaml" > "$previous_values"
                current_app_version=$(helm show chart "$chart" | awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }')
                previous_app_version=$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }' "$previous_chart")
                current_digest=$(image_value "$chart/values.yaml" digest)
                previous_digest=$(image_value "$previous_values" digest)
                rm -f "$previous_chart" "$previous_values"
                if [[ "$current_app_version" == "$previous_app_version" || -z "$current_digest" || "$current_digest" == "$previous_digest" ]]; then
                  echo "$chart is leaving release-pending state, so appVersion and the pinned image digest must be updated."
                  exit 1
                fi
              fi
              releasable+=("$chart")
            fi
          done <<< "$changed"

          if (( ${#pending[@]} > 0 && ${#releasable[@]} > 0 )); then
            echo "Release-pending and releasable chart changes must use separate pull requests."
            exit 1
          fi
          if (( ${#pending[@]} == 0 )); then
            ct lint --config ct.yaml
          fi

      - name: Verify optional database provider rendering
        run: |
          chart=charts/rootly-private-agent
          default_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false)
          if grep -qE '^      (postgresql|mysql):' <<<"$default_config"; then
            echo "Empty database providers must be omitted for compatibility with earlier agent images."
            exit 1
          fi
          database_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false \
            --set-json 'providers.postgresql=[{"id":"postgresql-test","host":"postgresql.internal","database":"app","username_file":"/run/secrets/postgresql/username","password_file":"/run/secrets/postgresql/password","allow_insecure":true,"allowed_schemas":["app"]}]' \
            --set-json 'providers.mysql=[{"id":"mysql-test","host":"mysql.internal","database":"app","username_file":"/run/secrets/mysql/username","password_file":"/run/secrets/mysql/password","allow_insecure":true,"allowed_schemas":["app"]}]')
          grep -q '^      postgresql:' <<<"$database_config"
          grep -q '^        - id: postgresql-test$' <<<"$database_config"
          grep -q '^      mysql:' <<<"$database_config"
          grep -q '^        - id: mysql-test$' <<<"$database_config"

  install:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml
