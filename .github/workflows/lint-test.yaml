name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "ct.yaml"
      - ".github/actionlint.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  lint:
    # Blacksmith provides a fresh managed runner for every job; no persistent
    # self-hosted machine, internal network, or repository secrets are exposed.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -config-file .github/actionlint.yaml

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          image_value() {
            awk -v key="$2" '
              /^image:$/ { in_image=1; next }
              in_image && /^[^ ]/ { exit }
              in_image && $1 == key ":" { gsub(/"/, "", $2); print $2; exit }
            ' "$1"
          }

          changed=$(ct list-changed --config ct.yaml)
          release_pending_chart="charts/rootly-private-agent"
          pending=()
          releasable=()
          while IFS= read -r chart; do
            base_pending=false
            if git cat-file -e "origin/master:$chart/.release-pending" 2>/dev/null; then
              base_pending=true
            fi
            if [[ ( -f "$chart/.release-pending" || "$base_pending" == true ) && "$chart" != "$release_pending_chart" ]]; then
              echo ".release-pending is currently supported only for $release_pending_chart."
              exit 1
            fi
            if [[ -f "$chart/.release-pending" ]]; then
              current_version=$(helm show chart "$chart" | awk '$1 == "version:" { print $2 }')
              current_app_version=$(helm show chart "$chart" | awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }')
              previous_chart=$(mktemp)
              previous_values=$(mktemp)
              git show "origin/master:$chart/Chart.yaml" > "$previous_chart"
              git show "origin/master:$chart/values.yaml" > "$previous_values"
              previous_version=$(awk '$1 == "version:" { print $2 }' "$previous_chart")
              previous_app_version=$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }' "$previous_chart")
              current_tag=$(image_value "$chart/values.yaml" tag)
              current_digest=$(image_value "$chart/values.yaml" digest)
              previous_tag=$(image_value "$previous_values" tag)
              previous_digest=$(image_value "$previous_values" digest)
              rm -f "$previous_chart" "$previous_values"
              if [[ "$current_version" != "$previous_version" || "$current_app_version" != "$previous_app_version" ||
                    "$current_tag" != "$previous_tag" || "$current_digest" != "$previous_digest" ]]; then
                echo "$chart is release-pending, so chart, app, and image versions must remain unchanged."
                exit 1
              fi
              ct lint --config ct.yaml --check-version-increment=false --charts "$chart"
              pending+=("$chart")
            else
              if [[ "$base_pending" == true ]]; then
                previous_chart=$(mktemp)
                previous_values=$(mktemp)
                git show "origin/master:$chart/Chart.yaml" > "$previous_chart"
                git show "origin/master:$chart/values.yaml" > "$previous_values"
                current_app_version=$(helm show chart "$chart" | awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }')
                previous_app_version=$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2 }' "$previous_chart")
                current_digest=$(image_value "$chart/values.yaml" digest)
                previous_digest=$(image_value "$previous_values" digest)
                rm -f "$previous_chart" "$previous_values"
                if [[ "$current_app_version" == "$previous_app_version" || -z "$current_digest" || "$current_digest" == "$previous_digest" ]]; then
                  echo "$chart is leaving release-pending state, so appVersion and the pinned image digest must be updated."
                  exit 1
                fi
              fi
              releasable+=("$chart")
            fi
          done <<< "$changed"

          if (( ${#pending[@]} > 0 && ${#releasable[@]} > 0 )); then
            echo "Release-pending and releasable chart changes must use separate pull requests."
            exit 1
          fi
          if (( ${#pending[@]} == 0 )); then
            ct lint --config ct.yaml
          fi

      - name: Verify optional private provider rendering
        run: |
          chart=charts/rootly-private-agent
          default_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false)
          if grep -qE '^      (tempo|pyroscope|argocd|postgresql|mysql|http):' <<<"$default_config"; then
            echo "Empty optional providers must be omitted for compatibility with earlier agent images."
            exit 1
          fi
          kubernetes_policy='{"allowedNamespaces":["default"],"allowClusterScoped":false,"defaultListLimit":500,"maximumListLimit":1000,"defaultWatchSeconds":30,"maximumWatchSeconds":60,"maximumResultBytes":2097152,"allowPodLogs":false,"allowInsecureLogBackendTLS":false,"defaultLogBytes":262144,"maximumLogBytes":1048576,"defaultLogSeconds":30,"maximumLogSeconds":60}'
          kubernetes_log_policy=${kubernetes_policy/\"allowPodLogs\":false/\"allowPodLogs\":true}
          kubernetes_config=$(helm template test "$chart" --set agent.controlPlaneEnabled=false \
            --set-json "providers.kubernetes=[{\"id\":\"production\",\"displayName\":\"Production\",\"kubeconfigFile\":\"\",\"context\":\"\",\"policy\":$kubernetes_policy},{\"id\":\"staging\",\"displayName\":\"Staging\",\"kubeconfigFile\":\"/run/secrets/kubernetes/staging.yaml\",\"context\":\"staging\",\"policy\":$kubernetes_log_policy}]")
          grep -q 'id: "production"' <<<"$kubernetes_config"
          grep -q 'id: "staging"' <<<"$kubernetes_config"
          grep -q 'kubeconfig_file: "/run/secrets/kubernetes/staging.yaml"' <<<"$kubernetes_config"
          grep -q 'context: "staging"' <<<"$kubernetes_config"
          grep -q 'automountServiceAccountToken: true' <<<"$kubernetes_config"
          if grep -q 'pods/log' <<<"$kubernetes_config"; then
            echo "Pod-log RBAC must not be granted when only a kubeconfig-backed provider enables logs."
            exit 1
          fi
          in_cluster_log_config=$(helm template test "$chart" --set agent.controlPlaneEnabled=false \
            --set-json "providers.kubernetes=[{\"id\":\"production\",\"displayName\":\"Production\",\"kubeconfigFile\":\"\",\"context\":\"\",\"policy\":$kubernetes_log_policy}]")
          if ! grep -q 'pods/log' <<<"$in_cluster_log_config"; then
            echo "Pod-log RBAC must be granted when the in-cluster provider enables logs."
            exit 1
          fi
          remote_kubernetes_config=$(helm template test "$chart" --set agent.controlPlaneEnabled=false --set rbac.create=false \
            --set-json "providers.kubernetes=[{\"id\":\"staging\",\"displayName\":\"Staging\",\"kubeconfigFile\":\"/run/secrets/kubernetes/staging.yaml\",\"context\":\"staging\",\"policy\":$kubernetes_policy}]")
          grep -q 'automountServiceAccountToken: false' <<<"$remote_kubernetes_config"
          if grep -q 'kind: ClusterRole' <<<"$remote_kubernetes_config"; then
            echo "A kubeconfig-only deployment must not render Kubernetes RBAC."
            exit 1
          fi
          disabled_kubernetes_config=$(helm template test "$chart" --set agent.controlPlaneEnabled=false --set rbac.create=false \
            --set-json 'providers.kubernetes=[]')
          if ! awk '$0 == "      kubernetes:" { getline; found = ($0 == "        []") } END { exit !found }' <<<"$disabled_kubernetes_config"; then
            echo "A disabled Kubernetes provider must render as an explicit empty list."
            exit 1
          fi
          grep -q 'automountServiceAccountToken: false' <<<"$disabled_kubernetes_config"
          if grep -q 'kind: ClusterRole' <<<"$disabled_kubernetes_config"; then
            echo "A Kubernetes-disabled deployment must not render Kubernetes RBAC."
            exit 1
          fi
          assert_invalid_kubernetes() {
            local values="$1"
            local reason="$2"
            shift 2
            if helm template test "$chart" --set agent.controlPlaneEnabled=false "$@" --set-json "providers.kubernetes=$values" >/dev/null 2>&1; then
              echo "Kubernetes provider configuration accepted $reason."
              exit 1
            fi
          }
          assert_invalid_kubernetes \
            '{"enabled":true}' \
            'the removed singleton provider shape'
          assert_invalid_kubernetes \
            "[{\"id\":\"duplicate\",\"displayName\":\"One\",\"kubeconfigFile\":\"\",\"context\":\"\",\"policy\":$kubernetes_policy},{\"id\":\"duplicate\",\"displayName\":\"Two\",\"kubeconfigFile\":\"/run/secrets/kubernetes/two.yaml\",\"context\":\"two\",\"policy\":$kubernetes_policy}]" \
            'duplicate provider IDs'
          assert_invalid_kubernetes \
            "[{\"id\":\"one\",\"displayName\":\"One\",\"kubeconfigFile\":\"\",\"context\":\"\",\"policy\":$kubernetes_policy},{\"id\":\"two\",\"displayName\":\"Two\",\"kubeconfigFile\":\"\",\"context\":\"\",\"policy\":$kubernetes_policy}]" \
            'multiple in-cluster providers'
          assert_invalid_kubernetes \
            "[{\"id\":\"context-only\",\"displayName\":\"Context only\",\"kubeconfigFile\":\"\",\"context\":\"staging\",\"policy\":$kubernetes_policy}]" \
            'a context without a kubeconfig file'
          assert_invalid_kubernetes \
            "[{\"id\":\"first\",\"displayName\":\"First\",\"kubeconfigFile\":\"\",\"context\":\"\",\"policy\":$kubernetes_policy},{\"id\":\"\",\"displayName\":\"Second\",\"kubeconfigFile\":\"/run/secrets/kubernetes/two.yaml\",\"context\":\"two\",\"policy\":$kubernetes_policy}]" \
            'an empty provider ID after the first entry'
          assert_invalid_kubernetes \
            "[{\"id\":\"in-cluster\",\"displayName\":\"In cluster\",\"kubeconfigFile\":\"\",\"context\":\"\",\"policy\":$kubernetes_policy}]" \
            'an in-cluster provider without a ServiceAccount name' \
            --set serviceAccount.create=false
          assert_invalid_kubernetes \
            "[{\"id\":\"remote\",\"displayName\":\"Remote\",\"kubeconfigFile\":\"/run/secrets/kubernetes/remote.yaml\",\"context\":\"remote\",\"policy\":$kubernetes_policy}]" \
            'chart-managed RBAC without an in-cluster provider'
          database_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false \
            --set-json 'providers.postgresql=[{"id":"postgresql-test","host":"postgresql.internal","database":"app","username_file":"/run/secrets/postgresql/username","password_file":"/run/secrets/postgresql/password","allow_insecure":true,"allowed_schemas":["app"]}]' \
            --set-json 'providers.mysql=[{"id":"mysql-test","host":"mysql.internal","database":"app","username_file":"/run/secrets/mysql/username","password_file":"/run/secrets/mysql/password","allow_insecure":true,"allowed_schemas":["app"]}]')
          grep -q '^      postgresql:' <<<"$database_config"
          grep -q 'id: postgresql-test' <<<"$database_config"
          grep -q '^      mysql:' <<<"$database_config"
          grep -q 'id: mysql-test' <<<"$database_config"
          tempo_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false \
            --set-json 'providers.tempo=[{"id":"traces-production","url":"https://tempo.internal/tempo","bearer_token_file":"/run/secrets/tempo/token","tenant_id_file":"/run/secrets/tempo/tenant","policy":{"maximum_traces":20,"maximum_range_seconds":3600}}]')
          grep -q '^      tempo:' <<<"$tempo_config"
          grep -q 'id: traces-production' <<<"$tempo_config"
          grep -q 'tenant_id_file: /run/secrets/tempo/tenant' <<<"$tempo_config"
          assert_invalid_tempo() {
            local values="$1"
            local reason="$2"
            if helm lint "$chart" --set agent.controlPlaneEnabled=false --set-json "providers.tempo=$values" >/dev/null 2>&1; then
              echo "Tempo provider schema accepted $reason."
              exit 1
            fi
          }
          assert_invalid_tempo \
            '[{"id":"unsafe","url":"http://tempo.internal"}]' \
            'plaintext HTTP without explicit opt-in'
          assert_invalid_tempo \
            '[{"id":"userinfo","url":"https://user:secret@tempo.internal"}]' \
            'credentials in the endpoint URL'
          assert_invalid_tempo \
            '[{"id":"inline-secret","url":"https://tempo.internal","bearer_token":"secret"}]' \
            'an inline bearer token'
          assert_invalid_tempo \
            '[{"id":"conflict","url":"https://tempo.internal","bearer_token_file":"/run/secrets/tempo/token","username_file":"/run/secrets/tempo/username","password_file":"/run/secrets/tempo/password"}]' \
            'multiple authentication mechanisms'
          assert_invalid_tempo \
            '[{"id":"partial-mtls","url":"https://tempo.internal","client_key_file":"/run/secrets/tempo/client.key"}]' \
            'a client key without a certificate'
          assert_invalid_tempo \
            '[{"id":"plaintext-tls","url":"http://tempo.internal","allow_insecure_http":true,"ca_bundle_file":"/run/secrets/tempo/ca.crt"}]' \
            'TLS settings on a plaintext endpoint'
          assert_invalid_tempo \
            '[{"id":"unbounded","url":"https://tempo.internal","policy":{"maximum_traces":101}}]' \
            'an out-of-range policy value'
          pyroscope_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false \
            --set-json 'providers.pyroscope=[{"id":"profiles-production","url":"https://pyroscope.internal/profiles","bearer_token_file":"/run/secrets/pyroscope/token","tenant_id_file":"/run/secrets/pyroscope/tenant","enforced_label_matchers":"{environment=\"production\"}","policy":{"maximum_nodes":512,"maximum_range_seconds":3600}}]')
          grep -q '^      pyroscope:' <<<"$pyroscope_config"
          grep -q 'id: profiles-production' <<<"$pyroscope_config"
          grep -q 'tenant_id_file: /run/secrets/pyroscope/tenant' <<<"$pyroscope_config"
          assert_invalid_pyroscope() {
            local values="$1"
            local reason="$2"
            if helm lint "$chart" --set agent.controlPlaneEnabled=false --set-json "providers.pyroscope=$values" >/dev/null 2>&1; then
              echo "Pyroscope provider schema accepted $reason."
              exit 1
            fi
          }
          assert_invalid_pyroscope \
            '[{"id":"unsafe","url":"http://pyroscope.internal"}]' \
            'plaintext HTTP without explicit opt-in'
          assert_invalid_pyroscope \
            '[{"id":"userinfo","url":"https://user:secret@pyroscope.internal"}]' \
            'credentials in the endpoint URL'
          assert_invalid_pyroscope \
            '[{"id":"inline-secret","url":"https://pyroscope.internal","bearer_token":"secret"}]' \
            'an inline bearer token'
          assert_invalid_pyroscope \
            '[{"id":"conflict","url":"https://pyroscope.internal","bearer_token_file":"/run/secrets/pyroscope/token","username_file":"/run/secrets/pyroscope/username","password_file":"/run/secrets/pyroscope/password"}]' \
            'multiple authentication mechanisms'
          assert_invalid_pyroscope \
            '[{"id":"partial-mtls","url":"https://pyroscope.internal","client_key_file":"/run/secrets/pyroscope/client.key"}]' \
            'a client key without a certificate'
          assert_invalid_pyroscope \
            '[{"id":"plaintext-tls","url":"http://pyroscope.internal","allow_insecure_http":true,"ca_bundle_file":"/run/secrets/pyroscope/ca.crt"}]' \
            'TLS settings on a plaintext endpoint'
          assert_invalid_pyroscope \
            '[{"id":"empty-scope","url":"https://pyroscope.internal","enforced_label_matchers":""}]' \
            'an empty configured label scope'
          assert_invalid_pyroscope \
            '[{"id":"empty-matcher-set","url":"https://pyroscope.internal","enforced_label_matchers":"{   }"}]' \
            'an explicitly empty matcher set'
          assert_invalid_pyroscope \
            '[{"id":"unbounded","url":"https://pyroscope.internal","policy":{"maximum_nodes":10001}}]' \
            'an out-of-range policy value'
          assert_invalid_pyroscope \
            '[{"id":"one-point-series","url":"https://pyroscope.internal","policy":{"maximum_points_per_series":1}}]' \
            'a point budget that cannot represent a timeline window'
          argocd_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false \
            --set-json 'providers.argocd=[{"id":"deployments-production","url":"https://argocd.internal","token_file":"/run/secrets/argocd/token","policy":{"allowed_projects":["payments"],"allow_cluster_inventory":false,"maximum_resources":500}}]')
          grep -q '^      argocd:' <<<"$argocd_config"
          grep -q 'id: deployments-production' <<<"$argocd_config"
          grep -q 'token_file: /run/secrets/argocd/token' <<<"$argocd_config"
          assert_invalid_argocd() {
            local values="$1"
            local reason="$2"
            if helm lint "$chart" --set agent.controlPlaneEnabled=false --set-json "providers.argocd=$values" >/dev/null 2>&1; then
              echo "Argo CD provider schema accepted $reason."
              exit 1
            fi
          }
          assert_invalid_argocd \
            '[{"id":"missing-token","url":"https://argocd.internal"}]' \
            'a missing token file'
          assert_invalid_argocd \
            '[{"id":"unsafe","url":"http://argocd.internal","token_file":"/run/secrets/argocd/token"}]' \
            'plaintext HTTP without explicit opt-in'
          assert_invalid_argocd \
            '[{"id":"userinfo","url":"https://admin:secret@argocd.internal","token_file":"/run/secrets/argocd/token"}]' \
            'credentials in the endpoint URL'
          assert_invalid_argocd \
            '[{"id":"partial-mtls","url":"https://argocd.internal","token_file":"/run/secrets/argocd/token","client_key_file":"/run/secrets/argocd/client.key"}]' \
            'a client key without a certificate'
          assert_invalid_argocd \
            '[{"id":"plaintext-tls","url":"http://argocd.internal","allow_insecure_http":true,"token_file":"/run/secrets/argocd/token","ca_bundle_file":"/run/secrets/argocd/ca.crt"}]' \
            'TLS settings on a plaintext endpoint'
          assert_invalid_argocd \
            '[{"id":"unbounded","url":"https://argocd.internal","token_file":"/run/secrets/argocd/token","policy":{"maximum_resources":2001}}]' \
            'an out-of-range policy value'
          if helm lint "$chart" --set agent.controlPlaneEnabled=false \
            --set-json 'providers.mysql=[{"id":"mysql-invalid","host":"mysql.internal","database":"app","username_file":"/run/secrets/mysql/username","password_file":"/run/secrets/mysql/password","allow_insecure":false,"ca_bundle_file":"/run/secrets/mysql/ca.crt","client_key_file":"/run/secrets/mysql/client.key","allowed_schemas":["app"]}]' \
            >/dev/null 2>&1; then
            echo "Database provider schema accepted a client key without a certificate."
            exit 1
          fi
          http_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false \
            --set-json 'providers.http=[{"id":"incidents-production","base_url":"https://incidents.internal/api","allowed_methods":["GET","POST"],"allowed_path_prefixes":["/v1/incidents"],"bearer_token_file":"/run/secrets/http/token"}]')
          grep -q '^      http:' <<<"$http_config"
          grep -q 'id: incidents-production' <<<"$http_config"
          grep -q 'bearer_token_file: /run/secrets/http/token' <<<"$http_config"
          http_variants_config=$(helm template test "$chart" --show-only templates/configmap.yaml --set agent.controlPlaneEnabled=false \
            --set-json 'providers.http=[{"id":"oauth-api","base_url":"https://oauth-api.internal","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"oauth2_client_credentials":{"token_url":"https://identity.internal/oauth/token","client_id_file":"/run/secrets/oauth/id","client_secret_file":"/run/secrets/oauth/secret","scopes":["api.read"],"header_files":{"X-Identity-Tenant":"/run/secrets/oauth/tenant"}}},{"id":"mtls-api","base_url":"https://mtls-api.internal","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"ca_bundle_file":"/run/secrets/mtls/ca.crt","client_certificate_file":"/run/secrets/mtls/client.crt","client_key_file":"/run/secrets/mtls/client.key"},{"id":"development-api","base_url":"http://development-api.internal","allow_insecure_http":true,"allowed_methods":["GET"],"allowed_path_prefixes":["/v1"]}]')
          grep -q 'id: oauth-api' <<<"$http_variants_config"
          grep -q 'token_url: https://identity.internal/oauth/token' <<<"$http_variants_config"
          grep -q 'X-Identity-Tenant: /run/secrets/oauth/tenant' <<<"$http_variants_config"
          grep -q 'id: mtls-api' <<<"$http_variants_config"
          grep -q 'client_certificate_file: /run/secrets/mtls/client.crt' <<<"$http_variants_config"
          grep -q 'id: development-api' <<<"$http_variants_config"
          grep -q 'allow_insecure_http: true' <<<"$http_variants_config"
          assert_invalid_http() {
            local values="$1"
            local reason="$2"
            if helm lint "$chart" --set agent.controlPlaneEnabled=false --set-json "providers.http=$values" >/dev/null 2>&1; then
              echo "HTTP provider schema accepted $reason."
              exit 1
            fi
          }
          assert_invalid_http \
            '[{"id":"unsafe","base_url":"http://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"]}]' \
            'plaintext HTTP without explicit opt-in'
          assert_invalid_http \
            '[{"id":"hostless","base_url":"https:///api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"]}]' \
            'a hostless base URL'
          assert_invalid_http \
            '[{"id":"userinfo","base_url":"https://user:secret@internal/api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"]}]' \
            'credentials in a base URL'
          assert_invalid_http \
            '[{"id":"base-query","base_url":"https://internal-api?tenant=one","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"]}]' \
            'a query in a base URL'
          assert_invalid_http \
            '[{"id":"bad-ipv6","base_url":"https://[::::]","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"]}]' \
            'a malformed IPv6 base URL'
          assert_invalid_http \
            '[{"id":"path-traversal","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1/../admin"]}]' \
            'a traversal path prefix'
          assert_invalid_http \
            '[{"id":"scheme-relative-path","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["//another-host/v1"]}]' \
            'a scheme-relative path prefix'
          assert_invalid_http \
            '[{"id":"health-query","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"health_check_path":"/health?full=true"}]' \
            'a query in a health-check path'
          assert_invalid_http \
            '[{"id":"oauth-userinfo","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"oauth2_client_credentials":{"token_url":"https://client:secret@identity/token","client_id_file":"/run/secrets/oauth/id","client_secret_file":"/run/secrets/oauth/secret"}}]' \
            'credentials in an OAuth token URL'
          assert_invalid_http \
            '[{"id":"oauth-fragment","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"oauth2_client_credentials":{"token_url":"https://identity/token#fragment","client_id_file":"/run/secrets/oauth/id","client_secret_file":"/run/secrets/oauth/secret"}}]' \
            'a fragment in an OAuth token URL'
          assert_invalid_http \
            '[{"id":"oauth-header-auth","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"oauth2_client_credentials":{"token_url":"https://identity/token","client_id_file":"/run/secrets/oauth/id","client_secret_file":"/run/secrets/oauth/secret","header_files":{"Authorization":"/run/secrets/oauth/token"}}}]' \
            'Authorization through OAuth token header_files'
          assert_invalid_http \
            '[{"id":"bad-port","base_url":"https://internal-api:99999","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"]}]' \
            'an out-of-range base URL port'
          assert_invalid_http \
            '[{"id":"oauth-bad-port","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"oauth2_client_credentials":{"token_url":"https://identity:00000/token","client_id_file":"/run/secrets/oauth/id","client_secret_file":"/run/secrets/oauth/secret"}}]' \
            'an out-of-range OAuth token URL port'
          assert_invalid_http \
            '[{"id":"header-auth","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"header_files":{"authorization":"/run/secrets/http/token"}}]' \
            'Authorization through header_files'
          assert_invalid_http \
            '[{"id":"mixed-case-header-auth","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"header_files":{"Authorization":"/run/secrets/http/token"}}]' \
            'mixed-case Authorization through header_files'
          assert_invalid_http \
            '[{"id":"method-override","base_url":"https://internal-api","allowed_methods":["POST"],"allowed_path_prefixes":["/v1"],"allowed_request_headers":["X-HTTP-Method-Override"]}]' \
            'an HTTP method-override request header'
          assert_invalid_http \
            '[{"id":"conflict","base_url":"https://internal-api","allowed_methods":["GET"],"allowed_path_prefixes":["/v1"],"bearer_token_file":"/run/secrets/http/token","username_file":"/run/secrets/http/username","password_file":"/run/secrets/http/password"}]' \
            'multiple Authorization mechanisms'

  install:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          releasable=()
          while IFS= read -r chart; do
            if [[ -z "$chart" ]]; then
              continue
            fi
            if [[ -f "$chart/.release-pending" ]]; then
              echo "Skipping install for release-pending chart $chart."
              continue
            fi
            releasable+=("$chart")
          done <<< "$changed"
          if (( ${#releasable[@]} > 0 )); then
            charts=$(IFS=,; echo "${releasable[*]}")
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "charts=$charts" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml --charts "${{ steps.list-changed.outputs.charts }}"
