{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rootly-private-agent.serviceAccountName" . }}
  labels:
    {{- include "rootly-private-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "rootly-private-agent.hasInClusterKubernetes" . }}
{{- end }}
