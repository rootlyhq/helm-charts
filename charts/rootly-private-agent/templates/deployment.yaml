{{- include "rootly-private-agent.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rootly-private-agent.fullname" . }}
  labels:
    {{- include "rootly-private-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rootly-private-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.agent.controlPlaneEnabled (not .Values.enrollment.existingSecret) }}
        checksum/enrollment: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rootly-private-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rootly-private-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "rootly-private-agent.hasInClusterKubernetes" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "rootly-private-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: ROOTLY_PRIVATE_AGENT_CONFIG_FILE
              value: /etc/rootly-private-agent/config.yaml
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rootly-private-agent/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: credentials
              mountPath: /var/lib/rootly-private-agent
            - name: tmp
              mountPath: /tmp
            {{- if .Values.agent.controlPlaneEnabled }}
            - name: enrollment
              mountPath: /var/run/secrets/rootly-private-agent/enrollment-token
              subPath: {{ .Values.enrollment.secretKey }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "rootly-private-agent.fullname" . }}
        - name: credentials
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rootly-private-agent.credentialClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.agent.controlPlaneEnabled }}
        - name: enrollment
          secret:
            secretName: {{ include "rootly-private-agent.enrollmentSecretName" . }}
            items:
              - key: {{ .Values.enrollment.secretKey }}
                path: {{ .Values.enrollment.secretKey }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
