apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rootly-private-agent.fullname" . }}
  labels:
    {{- include "rootly-private-agent.labels" . | nindent 4 }}
data:
  config.yaml: |
    version: 1
    runtime:
      listen_address: ":8080"
      log_level: {{ .Values.agent.logLevel | quote }}
      maximum_concurrency: {{ int .Values.agent.maximumConcurrency }}
    rootly:
      grpc_url: {{ .Values.agent.grpcURL | quote }}
      control_plane_enabled: {{ .Values.agent.controlPlaneEnabled }}
      agent_name: {{ include "rootly-private-agent.agentName" . | quote }}
      credential_state_file: /var/lib/rootly-private-agent/credentials.json
      enrollment_token_file: /var/run/secrets/rootly-private-agent/enrollment-token
      {{- with .Values.agent.caBundleFile }}
      ca_bundle_file: {{ . | quote }}
      {{- end }}
    providers:
      kubernetes:
        {{- range $index, $provider := .Values.providers.kubernetes }}
        {{- $id := $provider.id }}
        {{- if and (eq $index 0) (eq $id "") }}
        {{- $id = include "rootly-private-agent.agentName" $ }}
        {{- end }}
        - id: {{ $id | quote }}
          display_name: {{ default $id $provider.displayName | quote }}
          {{- with $provider.kubeconfigFile }}
          kubeconfig_file: {{ . | quote }}
          {{- end }}
          {{- with $provider.context }}
          context: {{ . | quote }}
          {{- end }}
          policy:
            allowed_namespaces:
              {{- toYaml $provider.policy.allowedNamespaces | nindent 14 }}
            allow_cluster_scoped: {{ $provider.policy.allowClusterScoped }}
            default_list_limit: {{ int $provider.policy.defaultListLimit }}
            maximum_list_limit: {{ int $provider.policy.maximumListLimit }}
            default_watch_seconds: {{ int $provider.policy.defaultWatchSeconds }}
            maximum_watch_seconds: {{ int $provider.policy.maximumWatchSeconds }}
            maximum_result_bytes: {{ int $provider.policy.maximumResultBytes }}
            allow_pod_logs: {{ $provider.policy.allowPodLogs }}
            allow_insecure_log_backend_tls: {{ $provider.policy.allowInsecureLogBackendTLS }}
            default_log_bytes: {{ int $provider.policy.defaultLogBytes }}
            maximum_log_bytes: {{ int $provider.policy.maximumLogBytes }}
            default_log_seconds: {{ int $provider.policy.defaultLogSeconds }}
            maximum_log_seconds: {{ int $provider.policy.maximumLogSeconds }}
        {{- end }}
      prometheus:
        {{- toYaml .Values.providers.prometheus | nindent 8 }}
      loki:
        {{- toYaml .Values.providers.loki | nindent 8 }}
      {{- with .Values.providers.tempo }}
      tempo:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.providers.argocd }}
      argocd:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      mcp:
        {{- toYaml .Values.providers.mcp | nindent 8 }}
      {{- with .Values.providers.postgresql }}
      postgresql:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.providers.mysql }}
      mysql:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.providers.http }}
      http:
        {{- toYaml . | nindent 8 }}
      {{- end }}
